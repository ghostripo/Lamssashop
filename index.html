<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lamssa Shop – ديزابي النوم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#f4f2ee;--card:#fff;--ink:#2e3140;--mute:#7a7a85;--brown:#5c4a3b;--line:#e4e1dc;--chip:#f1f2f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1917;--card:#262220;--ink:#efe9e2;--mute:#aaa299;--brown:#c8a98b;--line:#3a3430;--chip:#332e2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1917;--card:#262220;--ink:#efe9e2;--mute:#aaa299;--brown:#c8a98b;--line:#3a3430;--chip:#332e2a;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:90px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Jost,Cairo,sans-serif;line-height:1.7;padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--brown);outline-offset:3px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:80}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);display:flex;align-items:center;justify-content:space-between;padding:16px 22px;box-shadow:0 1px 0 var(--line)}
header svg,.pbar svg{width:27px;height:27px;stroke:var(--ink);fill:none;stroke-width:1.7}
.ic{display:flex;gap:18px}
.logo{text-align:center;line-height:1}
.logo b{display:block;font-weight:300;font-size:28px;letter-spacing:.2em;padding-inline-start:.2em}
.logo small{font-size:9px;letter-spacing:.5em;font-weight:500}
.cartbtn{position:relative}
.cartbtn i{position:absolute;top:-7px;inset-inline-end:-8px;background:var(--brown);color:var(--card);border-radius:99px;min-width:19px;height:19px;font:500 11px/19px Jost;text-align:center;font-style:normal}
#sb{display:none;background:var(--card);padding:0 22px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 61px);z-index:49}
#sb.on{display:block}
#sb input{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink);font:inherit}
.wrap{max-width:560px;margin:auto;padding:0 22px}
.intro{padding:34px 0 8px}
.intro h1{font-size:30px;font-weight:300;letter-spacing:.06em;line-height:1.4}
.intro p{color:var(--mute);margin-top:6px}
.list{display:grid;gap:26px;padding:24px 0 10px}
.card{background:var(--card);border-radius:4px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.07);cursor:pointer;display:block;width:100%;text-align:start}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.card div{padding:22px 24px 26px}
.card h3{font-size:17px;font-weight:300;letter-spacing:.14em}
.pcs{color:var(--mute);font-size:14px}
.price{color:var(--brown);font-weight:600;font-size:21px;margin-top:6px}
h2{font-size:26px;font-weight:300;letter-spacing:.2em;margin:56px 0 22px}
#about p{color:var(--mute)}
footer{padding:36px 22px;text-align:center;color:var(--mute);font-size:13px}
.bar{position:fixed;inset:auto 0 0;z-index:90;background:var(--brown);color:#fff;overflow:hidden;white-space:nowrap;padding:15px 0 calc(15px + env(safe-area-inset-bottom,0px));font-size:13px;letter-spacing:.16em}
.bar span{display:inline-block;padding-inline-start:100%;animation:mq 24s linear infinite}
@keyframes mq{to{transform:translateX(100%)}}
[dir=ltr] .bar span{animation-name:mq2}
@keyframes mq2{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.bar span{animation:none;padding:0 20px}html{scroll-behavior:auto}}
.panel{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto;padding-bottom:100px;display:none}
.panel.on{display:block}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;background:var(--card);box-shadow:0 1px 0 var(--line);position:sticky;top:0;z-index:2}
.menu a{display:block;padding:15px 0;font-size:19px;color:var(--ink);text-decoration:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.lang{display:flex;gap:12px;margin-top:12px}
.lang button{background:var(--chip);border-radius:14px;padding:18px 34px;font-weight:500;font-size:19px}
.lang button[aria-pressed=true]{background:#000;color:#fff}
.sheet{background:var(--card);border-radius:4px;margin:22px 0;padding:26px 24px}
.pimg{border-radius:4px;overflow:hidden;margin-top:22px}.pimg img{display:block;width:100%}
.sheet h1{font-size:23px;font-weight:300;letter-spacing:.12em}
.sheet .price{font-size:26px;margin:2px 0 14px}
.desc{color:var(--mute);font-size:17px;line-height:2}
.lbl{color:var(--mute);margin:30px 0 14px;font-size:19px}
.sws{display:flex;gap:14px}
.sw{width:52px;height:52px;border-radius:50%;border:2px solid var(--line);position:relative}
.sw[aria-pressed=true]{border:3px solid var(--brown);box-shadow:0 0 0 3px var(--card) inset}
.sw[aria-pressed=true]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;text-shadow:0 0 3px rgba(0,0,0,.45)}
.opt{background:var(--brown);color:var(--card);padding:16px 26px;border-radius:4px;font-size:18px}
.qty{display:inline-flex;align-items:center;gap:14px}
.qty button{width:58px;height:58px;border:1.5px solid var(--line);border-radius:4px;font-size:24px}
.qty span{min-width:46px;text-align:center;font-size:22px}
.cta{display:flex;gap:14px;margin:36px 0 26px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:99px;padding:18px 10px;min-height:76px;font-weight:500;letter-spacing:.12em;border:2.5px solid var(--brown);color:var(--brown);line-height:1.4;text-decoration:none}
.btn.fill{background:var(--brown);color:var(--card);box-shadow:0 8px 18px rgba(92,74,59,.28)}
details{border-top:1px solid var(--line);padding:22px 0}
details:last-child{border-bottom:1px solid var(--line)}
summary{font-weight:500;font-size:19px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"⌄";color:var(--mute)}
details p{color:var(--mute);margin-top:10px}
.more{padding:6px 0}.more .list{grid-template-columns:1fr 1fr;gap:14px}.more .card div{padding:12px}.more .card h3{font-size:12px;letter-spacing:.06em}.more .price{font-size:15px}
.row{display:flex;gap:14px;align-items:center;background:var(--card);padding:10px;border-radius:4px;margin-bottom:12px}
.row img{width:70px;height:93px;object-fit:cover;border-radius:3px}
.row div{flex:1;font-size:14px;line-height:1.6}.row .x{font-size:26px;padding:8px;color:var(--mute)}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:19px;margin:20px 0}
form input{width:100%;padding:15px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}
form button{width:100%;border:0;background:var(--brown);color:#fff;border-radius:99px;padding:18px;font-weight:600;font-size:16px;margin-top:6px}
#ok textarea{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:10px}#ok #cp{width:100%;border:0;background:var(--brown);color:var(--card);border-radius:99px;padding:18px;font-weight:600;font-size:16px}
.empty{color:var(--mute);text-align:center;padding:60px 0}
</style>
</head>

let L="ar",cur=0,col=0,q=1,cart=[],qs="";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],t=k=>D[L][k],money=n=>n+" "+t("da");
const card=i=>`<button class="card" data-o="${i}"><img src="${IMG[i]}" alt="" loading="lazy"><div><h3>${t("pn")}${i}</h3><p class="price">${money(P[i])}</p><p class="pcs">${pcs(i)} ${t("pcs")}</p></div></button>`;
function render(){
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 $$("[data-t]").forEach(e=>{const v=t(e.dataset.t);if(typeof v=="string")e.textContent=v});
 $$("[data-p]").forEach(e=>e.placeholder=t(e.dataset.p));
 $$("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l==L));
 $("#grid").innerHTML=IMG.map((_,i)=>i).filter(i=>!qs||String(i)==qs).map(card).join("");
 $("#pi").src=IMG[cur];$("#pn").textContent=t("pn")+cur;$("#pp").textContent=money(P[cur])+" · "+pcs(cur)+" "+t("pcs");$("#q").textContent=q;
 $("#sws").innerHTML=COL.map((c,i)=>`<button class="sw" style="background:${c}" aria-pressed="${i==col}" data-c="${i}" aria-label="${t("cn")[i]}"></button>`).join("");
 $("#more").innerHTML=[1,2,3,4].map(k=>(cur+k)%9).slice(0,4).map(card).join("");
 const n=cart.reduce((a,i)=>a+i.q,0);$("#cc").textContent=n;
 $("#items").innerHTML=cart.length?cart.map((i,k)=>`<div class="row"><img src="${IMG[i.id]}" alt=""><div><b>${t("pn")}${i.id}</b><br>${t("cn")[i.c]} · ${t("std")} · × ${i.q}<br>${money(i.q*P[i.id])}</div><button class="x" data-r="${k}" aria-label="x">×</button></div>`).join(""):`<p class="empty">${t("empty")}</p>`;
 $("#co").hidden=!cart.length;$("#tot").textContent=money(cart.reduce((a,i)=>a+i.q*P[i.id],0));
}
const open=id=>{$$(".panel").forEach(p=>p.classList.remove("on"));if(id){$(id).classList.add("on");$(id).scrollTop=0}document.body.style.overflow=id?"hidden":""};
function addItem(){$("#f").hidden=false;$("#ok").hidden=true;const f=cart.find(i=>i.id==cur&&i.c==col);f?f.q+=q:cart.push({id:cur,c:col,q});q=1;render()}
document.addEventListener("click",e=>{
 const b=e.target.closest("button,a");if(!b)return;
 if(b.id=="mb")open("#menu");else if(b.id=="cb")open("#cart");else if(b.id=="sbt"){$("#sb").classList.toggle("on");$("#sq").focus()}
 else if(b.dataset.o!==undefined){cur=+b.dataset.o;col=0;q=1;render();open("#pv")}
 else if(b.hasAttribute("data-close"))open();
 else if(b.dataset.l){L=b.dataset.l;render()}
 else if(b.dataset.c!==undefined){col=+b.dataset.c;render()}
 else if(b.id=="mn"){q=Math.max(1,q-1);render()}else if(b.id=="pl"){q++;render()}
 else if(b.id=="add"||b.id=="buy"){addItem();open("#cart")}
 else if(b.dataset.r!==undefined){cart.splice(+b.dataset.r,1);render()}
});
$("#sq").addEventListener("input",e=>{qs=e.target.value.trim();render()});
$("#f").addEventListener("submit",e=>{e.preventDefault();const d=new FormData(e.target),tot=cart.reduce((a,i)=>a+i.q*P[i.id],0);

 const m=`${t("msg")}\n${lines}\n${t("total")}: ${money(tot)}\n\n${t("cl")}: ${d.get("n")}\n${t("ph")}: ${d.get("p")}\n${t("wilaya")}: ${d.get("w")}\n${t("addr")}: ${d.get("a")}`;
 $("#ot").value=m;e.target.hidden=true;$("#ok").hidden=false;$("#ok").scrollIntoView({behavior:"smooth"})});
